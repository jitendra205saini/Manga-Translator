<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga Translator - API keys</title>
<link rel="icon" href="/icon.png">
<style>
  body { font-family: Segoe UI, sans-serif; background: #f6f3ee; color: #222; margin: 0; }
  main { max-width: 560px; margin: 40px auto; background: #fff; padding: 28px 32px; border-radius: 12px; box-shadow: 0 2px 12px #0001; }
  h1 { font-size: 22px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
  h1 img { width: 36px; height: 36px; }
  p.sub { color: #666; margin: 0 0 22px; }
  label { font-weight: 600; display: block; margin-top: 18px; }
  .hint { font-size: 13px; color: #666; margin: 4px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  .status { font-size: 13px; margin-top: 4px; }
  .ok { color: #1a7f37; } .missing { color: #b35900; }
  button { margin-top: 24px; background: #e8711a; color: #fff; border: 0; padding: 11px 22px; border-radius: 8px; font-size: 15px; cursor: pointer; }
  #msg { margin-top: 14px; font-weight: 600; }
  a { color: #c45a0c; }
</style>
</head>
<body>
<main>
  <h1><img src="/icon.png" alt="">Manga Translator</h1>
  <p class="sub">Add at least one free API key. Gemini is recommended; Groq is used as a backup.</p>

  <label for="gemini">Gemini API key</label>
  <div class="hint">Free key: <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> (sign in, click "Create API key", copy it)</div>
  <input id="gemini" placeholder="AIza..." autocomplete="off">
  <div class="status" id="gemini_s"></div>

  <label for="groq">Groq API key (optional)</label>
  <div class="hint">Free key: <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a></div>
  <input id="groq" placeholder="gsk_..." autocomplete="off">
  <div class="status" id="groq_s"></div>

  <button id="save">Save</button>
  <div id="msg"></div>
</main>
<script>
async function load() {
  const r = await (await fetch("/config")).json();
  for (const p of ["gemini", "groq"]) {
    const el = document.getElementById(p + "_s");
    el.textContent = r[p] ? "Saved key: " + r[p] + " (leave empty to keep it)" : "No key yet";
    el.className = "status " + (r[p] ? "ok" : "missing");
  }
}
document.getElementById("save").onclick = async () => {
  const body = { gemini: document.getElementById("gemini").value.trim(), groq: document.getElementById("groq").value.trim() };
  const r = await fetch("/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const msg = document.getElementById("msg");
  if (r.ok) {
    const j = await r.json();
    msg.textContent = j.ready ? "Saved. You can close this page and use the browser extension." : "Saved, but no key is set yet.";
    msg.style.color = j.ready ? "#1a7f37" : "#b35900";
    document.getElementById("gemini").value = document.getElementById("groq").value = "";
    load();
  } else {
    msg.textContent = "Could not save: " + (await r.text());
    msg.style.color = "#c00";
  }
};
load();
</script>
</body>
</html>
