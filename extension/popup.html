<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; color: #111; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
  button#toggle { width: 100%; padding: 9px; font-size: 14px; font-weight: 600; border: 0; border-radius: 6px; cursor: pointer; background: #e5e7eb; }
  button#toggle.on { background: #16a34a; color: #fff; }
  select { padding: 3px; }
  .usage { margin-top: 6px; padding-top: 6px; border-top: 1px solid #e5e7eb; }
  .status { margin-top: 10px; padding: 8px; background: #f3f4f6; border-radius: 6px; font-size: 12px; line-height: 1.6; }
  .ok { color: #15803d; } .bad { color: #b91c1c; } .muted { color: #6b7280; }
  .starting{color:#c77700;display:flex;align-items:center;gap:8px}
  .spin{width:12px;height:12px;border:2px solid #c7770044;border-top-color:#c77700;border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <h1 style="display:flex;align-items:center;gap:8px"><img src="icons/icon32.png" width="24" height="24" alt="">Manga Translator → Hindi<span id="ver" style="margin-left:auto;font-size:12px;font-weight:400;opacity:.6"></span></h1>
  <button id="perm" style="display:none;width:100%;padding:8px;margin-bottom:8px;background:#f59e0b;border:0;border-radius:6px;font-weight:600;cursor:pointer">Grant site access first</button>
  <button id="toggle">OFF</button>
  <div id="prog" style="display:none;margin-top:8px;font-size:13px">
    <div style="height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden"><div id="progbar" style="height:100%;width:0;background:#e8711a;transition:width .4s"></div></div>
    <div id="progtxt" style="margin-top:4px;color:#374151"></div>
  </div>
  <button id="orig" style="width:100%;padding:7px;margin-top:8px;border:1px solid #d1d5db;background:#fff;border-radius:6px;cursor:pointer">Show original (Alt+O)</button>
  <div class="row">
    <label for="always">Always on for this site</label>
    <input type="checkbox" id="always">
  </div>
  <div class="row">
    <label for="fast" title="Uses the faster Gemini Flash-Lite models first: about 2x faster, Hindi a little simpler">Fast mode (quicker, simpler Hindi)</label>
    <input type="checkbox" id="fast">
  </div>
  <div class="row">
    <label for="backup" title="When every AI limit is used up, English pages use the backup translator: formal Hindi, no gender awareness. Not cached, so the AI redoes them later.">Backup translator (English, when AI limit is over)</label>
    <input type="checkbox" id="backup">
  </div>
  <div class="row">
    <label for="lang">Language</label>
    <select id="lang">
      <option value="Auto">Auto</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="zh_hans">Chinese (Simplified)</option>
      <option value="zh_hant">Chinese (Traditional)</option>
      <option value="en">English</option>
    </select>
  </div>
  <div class="status" id="status">Checking server...</div>
  <div class="muted" style="margin-top:8px">Shortcuts: Alt+T (on/off), Alt+O (original / Hindi)</div>
  <script src="popup.js"></script>
</body>
</html>
